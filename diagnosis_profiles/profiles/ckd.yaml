condition_name: ckd
diagnosis_name: Chronic kidney disease, stage 3 (moderate)
icd10_code: N18.30

approximate_synonyms:
  - Chronic kidney disease
  - CKD
  - Stage 3 chronic kidney disease
  - Moderate chronic kidney disease
  - Chronic renal insufficiency
  - Chronic kidney disease stage 3

symptoms:
  common:
    - Fatigue
    - Pruritus (itchy skin)
    - Muscle cramps
    - Nausea
    - Peripheral edema (swelling)
    - Changes in urination frequency
    - Sleep disturbances
    - Shortness of breath

  groups:
    uremic_prodrome:
      symptoms:
        - Pruritus (itchy skin)
        - Nausea
        - Muscle cramps
        - Sleep disturbances

      management_probability:
        good: 0.10
        moderate: 0.35
        poor: 0.70
        not_managed: 0.85
        first_identification: 0.60

    fluid_overload:
      symptoms:
        - Peripheral edema (swelling)
        - Shortness of breath
        - Changes in urination frequency

      management_probability:
        good: 0.10
        moderate: 0.35
        poor: 0.70
        not_managed: 0.85
        first_identification: 0.60

    constitutional:
      symptoms:
        - Fatigue

      duration_probability:
        - max_years: 2
          probability: 0.15
        - max_years: 5
          probability: 0.35
        - max_years: null
          probability: 0.50

typical_physical_findings:
  - Pitting edema in lower extremities
  - Pallor
  - Hypertension
  - Asterixis
  - Dry skin

generated_lab_reports:
  - Serum Creatinine
  - Estimated Glomerular Filtration Rate (eGFR)
  - Blood Urea Nitrogen (BUN)

typical_investigations:
  - Urine albumin-to-creatinine ratio (UACR)
  - Renal ultrasound
  - Serum electrolytes panel
  - Complete blood count (CBC)
  - Intact parathyroid hormone (iPTH)

common_risk_factors:
  - Longstanding Diabetes Mellitus
  - Chronic Hypertension
  - Advanced age
  - Glomerulonephritis history
  - Family history of kidney disease
  - Obesity
  - Cardiovascular disease

common_comorbidities:
  - Hypertension
  - Type 2 diabetes mellitus
  - Hyperlipidemia
  - Anemia of chronic disease
  - Secondary hyperparathyroidism
  - Gout
  - Coronary artery disease

common_medications:
  - Losartan
  - Furosemide
  - Sevelamer
  - Erythropoietin alpha
  - Calcium carbonate
