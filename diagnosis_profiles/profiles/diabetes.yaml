condition_name: diabetes
diagnosis_name: Type 2 diabetes mellitus without complications
icd10_code: E11.9

approximate_synonyms:
  - Type 2 diabetes mellitus
  - Type 2 diabetes mellitus without complication
  - Type II diabetes mellitus without complication
  - Diabetes mellitus type 2
  - Diabetes type 2
  - Type 2 diabetes mellitus controlled by diet
  - Type 2 diabetes mellitus on insulin

symptoms:
  common:
    - Increased thirst
    - Frequent urination
    - Increased hunger
    - Unintentional weight loss
    - Fatigue
    - Blurred vision
    - Slow-healing wounds
    - Frequent infections
    - Numbness in the hands or feet
    - Tingling in the hands or feet

  groups:
    hyperglycemia:
      symptoms:
        - Increased thirst
        - Frequent urination
        - Increased hunger
        - Blurred vision

      management_probability:
        good: 0.10
        moderate: 0.35
        poor: 0.70
        not_managed: 0.85
        first_identification: 0.60

    neuropathy:
      symptoms:
        - Numbness in the hands or feet
        - Tingling in the hands or feet

      duration_probability:
