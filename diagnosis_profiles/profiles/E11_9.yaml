diagnosis_name: Type 2 diabetes mellitus without complications
icd10_code: E11.9

approximate_synonyms:
  - Type 2 diabetes mellitus
  - Type 2 diabetes mellitus without complication
  - Type II diabetes mellitus without complication
  - Diabetes mellitus type 2
  - Diabetes type 2
  - Type 2 diabetes mellitus controlled by diet
  - Type 2 diabetes mellitus on insulin

common_symptoms:
  - Increased thirst
  - Frequent urination
  - Increased hunger
  - Unintentional weight loss
  - Fatigue
  - Blurred vision
  - Slow-healing sores
  - Frequent infections
  - Numbness or tingling in the hands or feet
  - Acanthosis nigricans

typical_physical_findings:
  - Overweight or obesity
  - Acanthosis nigricans
  - Decreased sensation on foot examination
  - Diminished peripheral pulses
  - Diabetic dermopathy
  - Retinal changes
  - Slow-healing ulcers
  - Dry mucous membranes

typical_investigations:
  - Hemoglobin A1c (HbA1c)
  - Fasting plasma glucose (FPG)
  - Oral glucose tolerance test (OGTT)
  - Random plasma glucose
  - Urine albumin-to-creatinine ratio (UACR)
  - Fasting lipid profile
  - Serum creatinine
  - Estimated glomerular filtration rate (eGFR)

common_risk_factors:
  - Overweight or obesity
  - Physical inactivity
  - Family history of type 2 diabetes
  - Age 45 years or older
  - History of gestational diabetes
  - High-risk ethnicity
  - Cardiovascular disease
  - Polycystic ovary syndrome (PCOS)

common_comorbidities:
  - Hypertension
  - Dyslipidemia
  - Obesity
  - Chronic kidney disease
  - Non-alcoholic fatty liver disease
  - Obstructive sleep apnea
  - Depression
  - Anxiety